<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="ClinRisk - Healthcare Diagnosis Platform">
        <meta name="keywords" content="healthcare, diagnosis, AI, medical">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
        <title>ClinRisk - Login / Sign Up</title>
    </head>
    <body class="bg-light">
        <main>
            {% block content %}
            {% endblock content %}

            <!-- Navigation bar -->
            <nav class="fixed-bottom">
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-md-8">
                            <div class="card border-0 shadow-sm">
                                <div class="card-body p-3">
                                    <div class="row g-2 text-center">
                                        <div class="col-6 col-md-3">
                                            <a href='{{ url_for("search") }}' class="btn btn-outline-success btn-sm w-100">
                                                <i class="bi bi-search d-block"></i>
                                                <small>Fracture Search</small>
                                            </a>
                                        </div>
                                        <div class="col-6 col-md-3">
                                            <a href='{{ url_for("search_heart") }}' class="btn btn-outline-success btn-sm w-100">
                                                <i class="bi bi-heart-pulse d-block"></i>
                                                <small>Heart Search</small>
                                            </a>
                                        </div>
                                        <div class="col-6 col-md-3">
                                            <a href='{{ url_for("diagnosis") }}' class="btn btn-outline-primary btn-sm w-100">
                                                <i class="bi bi-x-ray d-block"></i>
                                                <small>Fracture Dx</small>
                                            </a>
                                        </div>
                                        <div class="col-6 col-md-3">
                                            <a href='{{ url_for("heart_disease_prediction") }}' class="btn btn-outline-danger btn-sm w-100">
                                                <i class="bi bi-heart-fill d-block"></i>
                                                <small>Heart Dx</small>
                                            </a>
                                        </div>
                                    </div>
                                    <div class="text-center mt-2">
                                        <a href='{{ url_for("home") }}' class="btn btn-outline-secondary btn-sm">
                                            <i class="bi bi-house-fill me-1"></i>Back to Home
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>
        </main>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
