{% macro t(text) -%}{{ text }}{%- endmacro %}
{% macro icon(name) -%}<i class="bi bi-{{ name }}" aria-hidden="true"></i>{%- endmacro %}
{% macro nav(endpoint, label, symbol, active) -%}
<a href="{{ url_for(endpoint) }}" class="nav-link{% if request.endpoint in active %} active{% endif %}"{% if request.endpoint in active %} aria-current="page"{% endif %}>{{ icon(symbol) }}{{ label }}{% if request.endpoint in active %}<span class="nav-dot"></span>{% endif %}</a>
{%- endmacro %}
